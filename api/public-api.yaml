openapi: 3.0.3
info:
  title: Booking System API
  description: |-
    TODO
  license:
    name: GNU Affero GPL 3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 1.0.0
tags:
  - name: public
    description: Public REST APIs
  - name: admin
    description: Private Administration REST APIs
paths:
  /api/v1/add-event:
    post:
      tags:
        - public
      summary: Add an event
      description: Add a new event to the calendar
      operationId: addEvent
      requestBody:
        description: Event to be added
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEvent'
        required: true
      responses:
        '200':
          description: Successfully added
        '409':
          description: Another event exists on this date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events:
    get:
      tags:
        - public
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: The date to obtain events from
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: The date to obtain events to
      responses:
        '200':
          description: "Zero or more events exist"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: Request parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events.ics:
    get:
      operationId: getEventsICS
      tags:
        - public
      responses:
        '200':
          description: "Zero or more events exist"
          content:
            text/calendar: {}
        '400':
          description: Request parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: The date to obtain events from
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: The date to obtain events to
        - in: query
          name: contact
          schema:
            type: string
          description: Optional filter to events for a specific contact. Value is the contact's email.
      responses:
        '200':
          description: "Zero or more events exist"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventList'
        '400':
          description: Request parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/invoiceable-events:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: List invoiceable individual events for a contact
      operationId: adminListInvoiceableEvents
      parameters:
        - in: query
          name: contact
          required: true
          schema:
            type: string
            format: email
          description: Contact email whose approved, uninvoiced individual events should be returned.
      responses:
        '200':
          description: Contact and zero or more invoiceable events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceableEvents'
        '400':
          description: Request parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/event-groups/search:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Search event groups by title
      operationId: adminSearchEventGroups
      parameters:
        - in: query
          name: title
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 200
          description: Case-insensitive partial event-group title to search for
      responses:
        '200':
          description: Matching event groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEventGroup'
        '400':
          description: Request parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/event-groups/{eventGroupID}:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Get an event group for duplication
      operationId: adminGetEventGroup
      parameters:
        - in: path
          name: eventGroupID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event group details and source setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventGroupDetails'
        '404':
          description: Event group does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/duplicate-event-group:
    post:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Duplicate an event group
      operationId: adminDuplicateEventGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDuplicateEventGroup'
      responses:
        '200':
          description: Event group duplicated successfully
        '404':
          description: Source event group does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: One or more schedule conflicts exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: path
          name: eventID
          schema:
            type: string
          description: The ID of the event to retrieve
      responses:
        '200':
          description: "Event exists"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/keyholders:
    put:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Set event keyholders
      operationId: adminSetEventKeyholders
      parameters:
        - in: path
          name: eventID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEventKeyholdersBody'
      responses:
        '200':
          description: Keyholders updated
        '404':
          description: No event exists with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/dates:
    put:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Update event dates and times
      operationId: adminUpdateEventDates
      parameters:
        - in: path
          name: eventID
          required: true
          schema:
            type: string
          description: The ID of the event to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventDatesBody'
      responses:
        '200':
          description: Event dates updated
        '404':
          description: No event exists with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The new dates conflict with an existing booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The date range is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/invoices/for-events:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminGetInvoicesForEvents
      parameters:
        - in: query
          required: false
          name: events
          schema:
            type: array
            items:
              type: string
          description: A comma-separated list of events to generate invoices for
        - in: query
          required: false
          name: eventGroup
          schema:
            type: string
          description: An event group to generate an invoice for
      responses:
        '200':
          description: "Invoice sent successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePreparations'
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/invoices/by-id/{invoiceID}:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminGetInvoiceByID
      parameters:
        - in: path
          name: invoiceID
          schema:
            type: string
          description: The ID of the Invoice to retrieve
      responses:
        '200':
          description: "Invoice found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: "No invoice exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/send-invoice:
    post:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminSendInvoice
      requestBody:
        description: Invoice to send
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInvoiceBody'
        required: true
      responses:
        '200':
          description: "Invoice sent successfully"
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/invoices/by-id/{invoiceID}/mark-as-paid:
    post:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminMarkInvoicePaid
      parameters:
        - in: path
          name: invoiceID
          schema:
            type: string
          description: The ID of the Invoice to mark as paid
      responses:
        '200':
          description: "Invoice marked as paid successfully"
        '404':
          description: "No invoice exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/rates:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminGetRates
      responses:
        '200':
          description: "Rates list"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesList'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminCreateRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRateBody'
      responses:
        '200':
          description: Rate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rate'
        '409':
          description: A rate with that identifier already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Rate definition is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/rates/{rateID}:
    put:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      operationId: adminUpdateRate
      parameters:
        - in: path
          name: rateID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRateBody'
      responses:
        '200':
          description: Rate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rate'
        '404':
          description: No rate exists with that identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Rate definition is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/set-rate:
    post:
      operationId: adminEventSetRate
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: path
          name: eventID
          schema:
            type: string
          description: The ID of the event to set the rate on
      requestBody:
        description: Rate to be set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRateBody'
        required: true
      responses:
        '200':
          description: "Event updated"
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/request-documents:
    post:
      operationId: adminEventRequestDocuments
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: path
          name: eventID
          schema:
            type: string
          description: The ID of the event to request documents for
      requestBody:
        description: Documents to be requested
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDocumentsBody'
        required: true
      responses:
        '200':
          description: "Documents requested"
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/cancel-event:
    post:
      operationId: adminEventCancel
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: path
          name: eventID
          schema:
            type: string
          description: The ID of the event to cancel
      responses:
        '200':
          description: "Event Cancelled"
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/events/{eventID}/approve-event:
    post:
      operationId: adminEventApprove
      security:
        - admin_auth: [ ]
      tags:
        - admin
      parameters:
        - in: path
          name: eventID
          schema:
            type: string
          description: The ID of the event to approve
      responses:
        '200':
          description: "Event Approved"
        '404':
          description: "No event exists with that ID"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/add-events:
    post:
      security:
        - admin_auth: [ ]
      summary: Add events
      description: Add new events to the calendar
      operationId: adminAddEvents
      requestBody:
        description: Events to be added
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNewEvents'
        required: true
      responses:
        '200':
          description: Successfully added
        '409':
          description: One or more conflicts exist
#          TODO this should be a partial response, I suspect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/add-event-group:
    post:
      security:
        - admin_auth: [ ]
      summary: Add an event group
      operationId: adminAddEventGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNewEventGroup'
      responses:
        '200':
          description: Successfully added
        '409':
          description: One or more conflicts exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/contacts:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: List contacts
      operationId: adminListContacts
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContactList'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/keyholders:
    get:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: List keyholders
      operationId: adminListKeyholders
      responses:
        '200':
          description: Keyholders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyholderList'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Create a keyholder
      operationId: adminCreateKeyholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyholderBody'
      responses:
        '200':
          description: Keyholder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyholder'
        '409':
          description: Key number is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/keyholders/{keyholderID}:
    put:
      security:
        - admin_auth: [ ]
      tags:
        - admin
      summary: Update a keyholder
      operationId: adminUpdateKeyholder
      parameters:
        - in: path
          name: keyholderID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyholderBody'
      responses:
        '200':
          description: Keyholder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyholder'
        '404':
          description: No keyholder exists with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Key number is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error_message
      properties:
        error_message:
          type: string
    NewEvent:
      type: object
      required:
        - event
        - contact
        - captchaToken
        - privacyPolicy
        - termsOfHire
        - cleaningAndDamage
        - carParking
        - adhesives
      properties:
        event:
          $ref: "#/components/schemas/EventDetails"
        contact:
          $ref: "#/components/schemas/Contact"
        captchaToken:
          type: string
        privacyPolicy:
          type: boolean
        termsOfHire:
          type: boolean
        cleaningAndDamage:
          type: boolean
        carParking:
          type: boolean
        adhesives:
          type: boolean
    EventDetails:
      type: object
      required:
        - name
        - details
        - from
        - to
        - publicly_visible
      properties:
        name:
          type: string
        details:
          type: string
        from:
          type: string
          format: datetime
        to:
          type: string
          format: datetime
        publicly_visible:
          type: boolean
          default: true
    Contact:
      type: object
      required:
        - name
        - email_address
      properties:
        name:
          type: string
        email_address:
          type: string
          format: email
    EventStatus:
      type: string
      enum: [ provisional, "awaiting documents", approved, cancelled ]
    EventList:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ListEvent'
    ListEvent:
      type: object
      required:
        - id
        - name
        - from
        - to
        - status
        - visible
      properties:
        id:
          type: string
        name:
